[project]
name = "session-duration-deployment-example"
version = "0.1.0"
description = "Ejemplo de entrenamiento automatizado y despliegue de modelo con FastAPI."
authors = [{ name = "MLOps Python" }]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.135,<0.136",
    "uvicorn[standard]>=0.34,<0.45",
    "pydantic>=2.10,<3.0",
    "pandas>=2.3,<3.0",
    "numpy>=2.0,<3.0",
    "scikit-learn>=1.8,<2.0",
    "joblib>=1.4,<2.0",
    "pyyaml>=6.0,<7.0"
]

[tool.poetry]
packages = [{ include = "session_duration_service", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
httpx = ">=0.28,<0.29"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"