data:
  n_samples: 1500
  random_state: 42
  noise_std: 4.5
  raw_path: data/raw/session_data.csv
  train_path: data/processed/train.csv
  test_path: data/processed/test.csv
split:
  test_size: 0.2
  random_state: 42
model:
  type: random_forest
  random_state: 42
  n_estimators: 120
  max_depth: 8
promotion:
  metric: rmse
  max_rmse: 6.0
  candidate_model_path: artifacts/candidate_model.joblib
  production_model_path: artifacts/model.joblib
  metadata_path: artifacts/model_metadata.json
