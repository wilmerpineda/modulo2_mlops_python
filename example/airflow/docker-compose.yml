services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

  airflow-init:
    image: apache/airflow:3.2.2
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      _PIP_ADDITIONAL_REQUIREMENTS: "pandas numpy scikit-learn joblib pyyaml"
    user: "0:0"
    volumes: &airflow-common-volumes
      - ./dags:/opt/airflow/dags
      - ../:/opt/airflow/project
      - ./logs:/opt/airflow/logs
      - ./config:/opt/airflow/config
      - ./plugins:/opt/airflow/plugins
    command: bash -c "airflow db migrate && airflow users create --username airflow --firstname Air --lastname Flow --role Admin --email airflow@example.com --password airflow || true"

  airflow-api-server:
    image: apache/airflow:3.2.2
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    ports:
      - "8080:8080"
    volumes: *airflow-common-volumes
    command: airflow api-server

  airflow-scheduler:
    image: apache/airflow:3.2.2
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: airflow scheduler

  airflow-dag-processor:
    image: apache/airflow:3.2.2
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: airflow dag-processor

volumes:
  postgres-db-volume:
